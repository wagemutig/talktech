[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Print link for the Zürcher Schulblatt: ausprobieren.talk-tech.ch shows the
# Mr. Barker one-pager at its root (force, because / would otherwise serve
# the main index.html). Assets resolve from the shared site root.
[[redirects]]
  from = "https://ausprobieren.talk-tech.ch/"
  to = "/mrbarker/"
  status = 200
  force = true

# Older and alternative paths
[[redirects]]
  from = "/schulblatt"
  to = "/mrbarker/"
  status = 301

[[redirects]]
  from = "/ausprobieren"
  to = "/mrbarker/"
  status = 301
